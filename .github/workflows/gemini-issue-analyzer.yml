name: Gemini Issue Analyzer

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  analyze-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze and Comment
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const issue = context.payload.issue || context.payload.pull_request;
            if (!issue) {
              console.log('No issue or pull request found in context.');
              return;
            }
            const issueTitle = issue.title;
            const issueBody = issue.body || 'No description provided.';
            const issueNumber = issue.number;
            
            console.log(`Analyzing issue #${issueNumber}: ${issueTitle}`);
            
            // 1. Fetch other recent issues/PRs to analyze redundancy/conflict
            let otherIssues = 'None';
            try {
              const issuesResponse = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'all',
                per_page: 30
              });
              otherIssues = issuesResponse.data
                .filter(i => i.number !== issueNumber)
                .map(i => `#${i.number} (${i.state}): ${i.title}`)
                .join('\n');
            } catch (err) {
              console.warn('Failed to fetch recent issues list:', err.message);
            }

            // 2. Prepare System and User prompt
            const systemPrompt = `너는 Senior 소프트웨어 엔지니어이자 프로젝트 매니저야.
            새로운 이슈/PR이 등록되었을 때, 다른 최근 이슈 목록을 참고하여 중복되거나 충돌할 만한 소지가 있는지 분석하고 아래 형식으로 리포트를 한국어로 작성해줘.
            
            ✨ Gemini AI (3.1 Flash Lite) 이슈 분석 리포트 ✨
            
            안녕하세요. 프로젝트의 안정적인 운영을 위해 이슈를 꼼꼼히 검토해 보았습니다. 요청하신 #${issueNumber}번 이슈에 대한 분석 결과입니다.
            
            1. 중복성 분석
            - 결과: [중복 없음 / 일부 연관성 있음 / 중복 가능성 높음] 중 하나 선택
            - 상세: [기존 이슈들과의 관계를 분석하여 설명. 연관이 있다면 해당 이슈 번호(#번호)를 언급하며 연관성 설명]
            
            2. 충돌 가능성 분석
            - 결과: [안전 / 주의 필요 / 충돌 가능성 높음] 중 하나 선택
            - 상세: [현재 등록된 이슈가 최근의 다른 이슈나 코드 변경점들과 충돌할 소지가 있는지 분석하여 설명. 충돌 가능성이 있는 이슈가 있다면 해당 이슈 번호(#번호)를 언급하며 설명]
            
            💡 시니어 엔지니어의 제언
            [이슈 해결을 위한 핵심 조언 및 권장 절차 작성]`;

            const userPrompt = `[분석 대상 이슈]
            번호: #${issueNumber}
            제목: ${issueTitle}
            본문:
            ${issueBody}
            
            [최근 등록된 다른 이슈 목록]
            ${otherIssues}`;

            // 3. Request Gemini API
            let resultText = '';
            try {
              const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${process.env.GEMINI_API_KEY}`, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  contents: [
                    {
                      role: 'user',
                      parts: [
                        { text: `${systemPrompt}\n\n분석할 내용:\n${userPrompt}` }
                      ]
                    }
                  ]
                })
              });
              
              if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Gemini API returned status ${response.status}: ${errorText}`);
              }
              
              const data = await response.json();
              resultText = data.candidates[0].content.parts[0].text;
            } catch (err) {
              console.error('Gemini API call failed:', err);
              resultText = `❌ Gemini AI 분석 중 오류가 발생했습니다: ${err.message}`;
            }

            // 4. Create comment on the issue/PR
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: resultText
              });
              console.log('Successfully posted comment.');
            } catch (err) {
              console.error('Failed to post comment on issue/PR:', err);
            }
