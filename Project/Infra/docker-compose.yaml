version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gpu-sharing-db
    environment:
      POSTGRES_DB: gpu_sharing
      POSTGRES_USER: gpu_user
      POSTGRES_PASSWORD: gpu_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gpu-sharing-network

  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: gpu-sharing-backend
    ports:
      - "8000:8000"
    environment:
      - SERVER_PORT=8000
      - DATABASE_URL=jdbc:postgresql://postgres:5432/gpu_sharing
      - DATABASE_USER=gpu_user
      - DATABASE_PW=gpu_password
      - JWT_SECRET=mySuperSecretKeyThatIsAtLeast32CharactersLongAndSecure1234
      - JWT_EXPIRE_HOURS=24
      - RELAY_SERVER_URL=http://relay:5000
      - WORKER_API_PORT=5000
      - RTX6000_WORKER_URL=http://host.docker.internal:5001
      - RTX4090_WORKER_URL=http://host.docker.internal:5002
      - RTX4090_SSH_HOST=194.14.47.19
      - RTX4090_SSH_PORT=22062
      - RTX4090_SSH_USER=root
    volumes:
      - ~/.ssh:/root/.ssh:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    networks:
      - gpu-sharing-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    container_name: gpu-sharing-frontend
    ports:
      - "4000:80"
    depends_on:
      - backend
    networks:
      - gpu-sharing-network

  worker:
    build:
      context: ../Worker
      dockerfile: Dockerfile
    container_name: gpu-sharing-worker
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gpu-sharing-network

volumes:
  postgres_data:

networks:
  gpu-sharing-network:
    driver: bridge
